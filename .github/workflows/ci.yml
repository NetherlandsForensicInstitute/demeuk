name: Demeuk CI

on:
  push:
  pull_request:

jobs:
  test-latest:
    name: Test Python 3.15 on ${{ matrix.os }}
    # Test only latest python version on non-master pushes
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pdm install -G test
      - name: Run tests
        run: |
          pdm run test -e 3.15

  test-matrix:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    # Test the full matrix on PR to master, or push to master.
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'master') ||
      github.ref == 'refs/heads/master'

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          set +x
          python -m pip install --upgrade pip
          pdm install -G test
      - name: Run tests
        run: |
          pdm run test -e ${{ matrix.python-version }}
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pdm install -G coverage
      - name: Run tests
        run: |
          pdm run test-coverage


  publish:
    runs-on: ubuntu-latest
    needs: [test-matrix, coverage]
    # Only publish on master
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.15'
      - name: Publish wheel
        env:
          PDM_PUBLISH_USERNAME: __token__
          PDM_PUBLISH_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: pdm publish
