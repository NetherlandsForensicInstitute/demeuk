version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - '"$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m pip install "pdm==2.29.7"'
      - PDM_PYTHON="$READTHEDOCS_VIRTUALENV_PATH/bin/python" "$READTHEDOCS_VIRTUALENV_PATH/bin/pdm" sync -G docs
sphinx:
  configuration: docs/conf.py
